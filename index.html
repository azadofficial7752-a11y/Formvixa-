<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FORMVIXA — Perfect Photo & Signature Resizer for Every Online Form</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css"
/>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #1f2937;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
    color: white;
    padding: 26px 18px;
    text-align: center;
    border-radius: 0 0 18px 18px;
  }
  header h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 2px;
  }
  header p {
    margin: 8px 0 0;
    font-size: 16px;
    opacity: .95;
  }

  .card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }

  .mode-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .mode-buttons button {
    flex: 1;
    padding: 12px;
    border: 2px solid #d1d5db;
    background: white;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .mode-buttons button.active {
    border-color: #1d4ed8;
    background: #eff6ff;
    color: #1d4ed8;
  }

  .upload-box {
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    background: #f8fafc;
  }
  .upload-box:hover { background: #eff6ff; }

  .editor-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media(min-width: 760px) {
    .editor-grid { grid-template-columns: 1.4fr 1fr; }
  }

  .image-area {
    width: 100%;
    max-height: 430px;
    overflow: hidden;
    background: #e5e7eb;
    border-radius: 10px;
  }
  .image-area img {
    display: block;
    max-width: 100%;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin: 12px 0 6px;
  }
  input[type="number"], select {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row input[type="range"] { flex: 1; }
  .slider-value {
    min-width: 48px;
    text-align: right;
    font-weight: bold;
  }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-primary { background: #1d4ed8; color: white; }
  .btn-secondary { background: #e5e7eb; color: #111827; }
  .btn-success { background: #059669; color: white; }
  .btn-danger { background: #dc2626; color: white; }

  .preview-box {
    text-align: center;
  }
  .preview-box img {
    max-width: 100%;
    max-height: 300px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: white;
  }

  .hidden { display: none; }
  .note {
    font-size: 13px;
    color: #64748b;
    margin-top: 8px;
  }

  footer {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    padding: 20px 0;
  }
</style>
</head>

<body>

<header>
  <h1>FORMVIXA</h1>
  <p>Perfect Photo & Signature Resizer for Every Online Form</p>
</header>

<div class="container">

  <div class="card">
    <div class="mode-buttons">
      <button id="photoMode" class="active">Photo</button>
      <button id="signatureMode">Signature</button>
    </div>

    <div class="upload-box" id="uploadBox">
      <strong>Tap here to select image</strong>
      <p class="note">Supported: JPG, JPEG, PNG, WebP</p>
      <input type="file" id="fileInput" accept="image/*" class="hidden" />
    </div>
  </div>

  <div class="card hidden" id="editorCard">
    <div class="editor-grid">

      <div>
        <div class="image-area">
          <img id="editorImage" alt="Selected image" />
        </div>

        <button class="btn btn-secondary" id="enableCrop">Enable Crop</button>
        <button class="btn btn-secondary hidden" id="disableCrop">Disable Crop</button>
        <button class="btn btn-danger" id="resetBtn">Reset</button>
      </div>

      <div>
        <label>Resize Width (px)</label>
        <input type="number" id="widthInput" min="1" placeholder="Example: 200" />

        <label>Resize Height (px)</label>
        <input type="number" id="heightInput" min="1" placeholder="Example: 250" />

        <button class="btn btn-secondary" id="lockRatio">Lock Aspect Ratio: OFF</button>

        <label>Brightness</label>
        <div class="slider-row">
          <input type="range" id="brightness" min="0" max="200" value="100" />
          <span class="slider-value" id="brightnessValue">100%</span>
        </div>

        <label>Contrast</label>
        <div class="slider-row">
          <input type="range" id="contrast" min="0" max="200" value="100" />
          <span class="slider-value" id="contrastValue">100%</span>
        </div>

        <label>Sharpness / Clean</label>
        <div class="slider-row">
          <input type="range" id="sharpness" min="0" max="100" value="0" />
          <span class="slider-value" id="sharpnessValue">0%</span>
        </div>

        <label>Output Format</label>
        <select id="format">
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>

        <label>Quality</label>
        <div class="slider-row">
          <input type="range" id="quality" min="50" max="100" value="95" />
          <span class="slider-value" id="qualityValue">95%</span>
        </div>

        <button class="btn btn-primary" id="previewBtn">Update Preview</button>
        <button class="btn btn-success" id="downloadBtn">Download Image</button>
      </div>

    </div>
  </div>

  <div class="card hidden" id="previewCard">
    <h3>Preview</h3>
    <div class="preview-box">
      <img id="previewImage" alt="Preview" />
    </div>
    <p class="note" id="previewInfo"></p>
  </div>

</div>

<footer>
  FORMVIXA — Resize, crop and clean your photo and signature for online forms.
</footer>

<script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>
<script>
const fileInput = document.getElementById("fileInput");
const uploadBox = document.getElementById("uploadBox");
const editorCard = document.getElementById("editorCard");
const previewCard = document.getElementById("previewCard");
const editorImage = document.getElementById("editorImage");
const previewImage = document.getElementById("previewImage");
const previewInfo = document.getElementById("previewInfo");

const photoMode = document.getElementById("photoMode");
const signatureMode = document.getElementById("signatureMode");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const lockRatioBtn = document.getElementById("lockRatio");

const brightness = document.getElementById("brightness");
const contrast = document.getElementById("contrast");
const sharpness = document.getElementById("sharpness");
const quality = document.getElementById("quality");

const brightnessValue = document.getElementById("brightnessValue");
const contrastValue = document.getElementById("contrastValue");
const sharpnessValue = document.getElementById("sharpnessValue");
const qualityValue = document.getElementById("qualityValue");

const format = document.getElementById("format");
const enableCrop = document.getElementById("enableCrop");
const disableCrop = document.getElementById("disableCrop");
const resetBtn = document.getElementById("resetBtn");
const previewBtn = document.getElementById("previewBtn");
const downloadBtn = document.getElementById("downloadBtn");

let cropper = null;
let originalImage = null;
let currentMode = "photo";
let lockRatio = false;
let originalRatio = 1;

photoMode.addEventListener("click", () => setMode("photo"));
signatureMode.addEventListener("click", () => setMode("signature"));

function setMode(mode) {
  currentMode = mode;
  photoMode.classList.toggle("active", mode === "photo");
  signatureMode.classList.toggle("active", mode === "signature");
  resetAll();
}

uploadBox.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    editorImage.src = event.target.result;
    editorCard.classList.remove("hidden");

    editorImage.onload = function() {
      originalImage = editorImage.src;
      originalRatio = editorImage.naturalWidth / editorImage.naturalHeight;

      widthInput.value = editorImage.naturalWidth;
      heightInput.value = editorImage.naturalHeight;

      destroyCropper();
      createCropper();
    };
  };
  reader.readAsDataURL(file);
});

function createCropper() {
  cropper = new Cropper(editorImage, {
    viewMode: 1,
    autoCropArea: 1,
    background: false,
    responsive: true,
    checkOrientation: true
  });
}

function destroyCropper() {
  if (cropper) {
    cropper.destroy();
    cropper = null;
  }
}

enableCrop.addEventListener("click", () => {
  if (!originalImage) return;
  destroyCropper();
  createCropper();
  enableCrop.classList.add("hidden");
  disableCrop.classList.remove("hidden");
});

disableCrop.addEventListener("click", () => {
  destroyCropper();
  editorImage.src = originalImage;
  enableCrop.classList.remove("hidden");
  disableCrop.classList.add("hidden");
});

lockRatioBtn.addEventListener("click", () => {
  lockRatio = !lockRatio;
  lockRatioBtn.textContent = "Lock Aspect Ratio: " + (lockRatio ? "ON" : "OFF");
});

widthInput.addEventListener("input", () => {
  if (lockRatio && widthInput.value) {
    heightInput.value = Math.round(widthInput.value / originalRatio);
  }
});

heightInput.addEventListener("input", () => {
  if (lockRatio && heightInput.value) {
    widthInput.value = Math.round(heightInput.value * originalRatio);
  }
});

brightness.addEventListener("input", () => {
  brightnessValue.textContent = brightness.value + "%";
});

contrast.addEventListener("input", () => {
  contrastValue.textContent = contrast.value + "%";
});

sharpness.addEventListener("input", () => {
  sharpnessValue.textContent = sharpness.value + "%";
});

quality.addEventListener("input", () => {
  qualityValue.textContent = quality.value + "%";
});

function getProcessedImage() {
  let canvas;

  if (cropper) {
    canvas = cropper.getCroppedCanvas({
      imageSmoothingEnabled: true,
      imageSmoothingQuality: "high"
    });
  } else {
    const img = new Image();
    img.src = originalImage;
    canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
  }

  const targetWidth = parseInt(widthInput.value) || canvas.width;
  const targetHeight = parseInt(heightInput.value) || canvas.height;

  const resized = document.createElement("canvas");
  resized.width = targetWidth;
  resized.height = targetHeight;

  const ctx = resized.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  ctx.filter =
    "brightness(" + brightness.value + "%) " +
    "contrast(" + contrast.value + "%)";

  ctx.drawImage(canvas, 0, 0, targetWidth, targetHeight);
  ctx.filter = "none";

  const sharp = parseInt(sharpness.value);

  if (sharp > 0) {
    applySharpness(resized, sharp / 100);
  }

  return resized;
}

function applySharpness(canvas, amount) {
  const ctx = canvas.getContext("2d");
  const width = canvas.width;
  const height = canvas.height;

  const src = ctx.getImageData(0, 0, width, height);
  const out = ctx.createImageData(width, height);

  const center = 1 + 4 * amount;
  const side = -amount;

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (let c = 0; c < 3; c++) {
        const i = (y * width + x) * 4 + c;

        const current = src.data[i];
        const left = x > 0 ? src.data[i - 4] : current;
        const right = x < width - 1 ? src.data[i + 4] : current;
        const top = y > 0 ? src.data[i - width * 4] : current;
        const bottom = y < height - 1 ? src.data[i + width * 4] : current;

        let value =
          center * current +
          side * left +
          side * right +
          side * top +
          side * bottom;

        out.data[i] = Math.max(0, Math.min(255, value));
      }

      const alphaIndex = (y * width + x) * 4 + 3;
      out.data[alphaIndex] = src.data[alphaIndex];
    }
  }

  ctx.putImageData(out, 0, 0);
}

previewBtn.addEventListener("click", () => {
  if (!originalImage) return;

  const canvas = getProcessedImage();
  const type = format.value;
  const q = parseInt(quality.value) / 100;

  previewImage.src = canvas.toDataURL(type, q);

  previewCard.classList.remove("hidden");
  previewInfo.textContent =
    "Output size: " + canvas.width + " x " + canvas.height + " px";
});

downloadBtn.addEventListener("click", () => {
  if (!originalImage) return;

  const canvas = getProcessedImage();
  const type = format.value;
  const q = parseInt(quality.value) / 100;

  const extension =
    type === "image/jpeg" ? "jpg" :
    type === "image/png" ? "png" : "webp";

  const link = document.createElement("a");
  link.download = currentMode + "-resized." + extension;
  link.href = canvas.toDataURL(type, q);
  link.click();
});

resetBtn.addEventListener("click", resetAll);

function resetAll() {
  destroyCropper();
  originalImage = null;
  fileInput.value = "";

  editorCard.classList.add("hidden");
  previewCard.classList.add("hidden");

  widthInput.value = "";
  heightInput.value = "";
  brightness.value = 100;
  contrast.value = 100;
  sharpness.value = 0;
  quality.value = 95;

  brightnessValue.textContent = "100%";
  contrastValue.textContent = "100%";
  sharpnessValue.textContent = "0%";
  qualityValue.textContent = "95%";

  enableCrop.classList.remove("hidden");
  disableCrop.classList.add("hidden");
}
</script>

</body>
          </html>
